    <circle cx="0" cy="0" r="120" fill="#fff"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#9d0208" stroke-width="11"/>
    <g stroke="#15181c" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-106" x2="0" y2="-86"/>
      <line x1="106" y1="0" x2="86" y2="0"/>
      <line x1="-106" y1="0" x2="-86" y2="0"/>
      <line x1="75" y1="-75" x2="61" y2="-61"/>
      <line x1="-75" y1="-75" x2="-61" y2="-61"/>
    </g>
    <line x1="0" y1="0" x2="66" y2="-53" stroke="#c1121f" stroke-width="13" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="16" fill="#15181c"/>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#15181c" text-anchor="middle">bar</text>
  </g>
</svg>
