<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="COD1 pompe">
  <!-- Fond plein (déborde la safe-zone) -->
  <rect width="512" height="512" fill="#c1121f"/>
  <!-- Tout le contenu confiné dans la zone sûre centrale (~60%) -->
