  <g stroke="#15181c" stroke-width="9" stroke-linecap="round">
    <line x1="256" y1="100" x2="256" y2="124"/>
    <line x1="388" y1="232" x2="364" y2="232"/>
    <line x1="124" y1="232" x2="148" y2="232"/>
    <line x1="349" y1="139" x2="332" y2="156"/>
    <line x1="163" y1="139" x2="180" y2="156"/>
    <line x1="349" y1="325" x2="332" y2="308"/>
    <line x1="163" y1="325" x2="180" y2="308"/>
  </g>
  <!-- aiguille (vers zone haute) -->
  <line x1="256" y1="232" x2="338" y2="166" stroke="#c1121f" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="232" r="20" fill="#15181c"/>
  <!-- texte bar -->
  <text x="256" y="300" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#15181c" text-anchor="middle">bar</text>
  <!-- bandeau COD1 -->
  <text x="256" y="452" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="4">COD1</text>
