<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="COD1 pompe">
  <rect width="512" height="512" rx="96" fill="#c1121f"/>
  <!-- manomètre -->
  <circle cx="256" cy="232" r="150" fill="#fff"/>
  <circle cx="256" cy="232" r="150" fill="none" stroke="#9d0208" stroke-width="14"/>
